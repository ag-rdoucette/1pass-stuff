name: Validate 1Password Brokered Access

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  # Required — lets GitHub issue the OIDC token the runner presents to 1Password.
  id-token: write
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Load secrets from 1Password (Brokered Access)
        uses: 1Password/load-secrets-action@v5beta
        with:
          export-env: true
        env:
          OP_WORKLOAD_ID: "HUXTTQKRHZFJPPPSER363NFBEE"
          OP_ENVIRONMENT_ID: "sy7mqjtptbksgtze3i3uirxidi"
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - name: Confirm Brokered Access succeeded
        run: echo "Brokered Access load step completed — OIDC token accepted and secrets injected."
